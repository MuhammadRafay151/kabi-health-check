name: Buddy's API Health Check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Buddy's API health
        run: |
          HTTP_STATUS=$(curl \
            --silent \
            --output /tmp/response.txt \
            --write-out "%{http_code}" \
            --max-time 20 \
            "${{ secrets.BUDDYS_HEALTH_URL }}")

          RESPONSE=$(cat /tmp/response.txt)

          echo "HTTP status: $HTTP_STATUS"
          echo "Response: $RESPONSE"

          # Make the values available to subsequent steps
          {
            echo "HTTP_STATUS=$HTTP_STATUS"
            echo "RESPONSE<<EOF"
            echo "$RESPONSE"
            echo "EOF"
          } >> "$GITHUB_ENV"

          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "Health check failed"
            exit 1
          fi

      - name: Send WhatsApp success notification
        if: success()
        run: |
          curl --fail --request POST \
            "${{ secrets.COMM_API_URL }}" \
            --header "accept: */*" \
            --header "organization-unit: CARS_TAXI" \
            --header "bussiness-unit: AUTO" \
            --header "channel: API" \
            --header "accept-language: EN" \
            --header "source: Buddysapp" \
            --header "Content-Type: application/json" \
            --data "$(jq -n \
              --arg number "${{ secrets.WHATSAPP_NUMBER }}" \
              --arg response "$RESPONSE" \
              --arg status "$HTTP_STATUS" \
              '{
                priority: 1,
                data: {
                  to: [$number],
                  type: "template",
                  body: {
                    template: {
                      name: "driver_general",
                      language: {
                        code: "en_US"
                      },
                      components: [
                        {
                          type: "body",
                          parameters: [
                            {
                              type: "TEXT",
                              text: ("✅ Buddy API health check is OK.\nHTTP Status: " + $status + "\nResponse: " + $response)
                            }
                          ]
                        }
                      ]
                    }
                  }
                },
                modes: [
                  {
                    type: "WHATSAPP",
                    provider: "FACEBOOK"
                  }
                ]
              }')"

      - name: Send WhatsApp failure notification
        if: failure()
        run: |
          curl --fail --request POST \
            "${{ secrets.COMM_API_URL }}" \
            --header "accept: */*" \
            --header "organization-unit: CARS_TAXI" \
            --header "bussiness-unit: AUTO" \
            --header "channel: API" \
            --header "accept-language: EN" \
            --header "source: Buddysapp" \
            --header "Content-Type: application/json" \
            --data "$(jq -n \
              --arg number "${{ secrets.WHATSAPP_NUMBER }}" \
              --arg response "${RESPONSE:-No response received}" \
              --arg status "${HTTP_STATUS:-Request failed}" \
              '{
                priority: 1,
                data: {
                  to: [$number],
                  type: "template",
                  body: {
                    template: {
                      name: "driver_general",
                      language: {
                        code: "en_US"
                      },
                      components: [
                        {
                          type: "body",
                          parameters: [
                            {
                              type: "TEXT",
                              text: ("🚨 Buddy API health check FAILED.\nHTTP Status: " + $status + "\nResponse: " + $response)
                            }
                          ]
                        }
                      ]
                    }
                  }
                },
                modes: [
                  {
                    type: "WHATSAPP",
                    provider: "FACEBOOK"
                  }
                ]
              }')"
